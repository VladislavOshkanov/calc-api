[package]
name = "openapi"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "fs", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mongodb = "3.10.0"
futures = "0.3"
mime_guess = "2.0"
regex = "1"
htmlescape = "0.3"
anyhow = "1.0"

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["json"] }
uuid = { version = "1.29.2", features = ["v4"] }
tower = "0.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
