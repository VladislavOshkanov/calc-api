[package]
name = "openapi"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7.9"
axum-server= "0.7.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mongodb = "2.0"
futures= "0.3"
tower = "0.4"
hyper = "0.14"
dotenv = "0.15"
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.11", features = ["json"] }
tokio-test = "0.4"
anyhow = "1.0"